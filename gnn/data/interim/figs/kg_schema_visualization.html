<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Lung-CABO Knowledge Graph Schema</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, -apple-system, sans-serif; }
.header { padding: 16px 24px 8px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
h2 { color: #fff; font-size: 18px; }
h2 span { font-weight: 400; font-size: 13px; margin-left: 12px; color: #aaa; }
.subtitle { margin-top: 4px; font-size: 12px; color: #888; }
.legend { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.legend-item { display: flex; align-items: center; gap: 4px; font-size: 11px; }
.legend-dot { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
svg { width: 100%; max-height: 640px; }
.node-group { cursor: pointer; }
.edge-label { display: none; font-size: 8px; font-family: system-ui; }
.info-bar { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.9); border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; padding: 10px 20px; font-size: 12px; display: none; gap: 20px; align-items: center; }
table { width: 100%; font-size: 11px; border-collapse: collapse; }
th { text-align: left; padding: 6px 8px; color: #aaa; border-bottom: 1px solid rgba(255,255,255,0.15); }
td { padding: 4px 8px; border-bottom: 1px solid rgba(255,255,255,0.05); }
.td-right { text-align: right; font-variant-numeric: tabular-nums; }
.btn { padding: 4px 10px; font-size: 11px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 4px; color: #ccc; cursor: pointer; margin-left: 8px; }
.btn:hover { background: rgba(255,255,255,0.2); }
#table-wrap { display: none; max-height: 260px; overflow-y: auto; padding: 0 24px 16px; }
</style>
</head>
<body>
<div class="header">
  <div>
    <h2>Lung-CABO Knowledge Graph<span>22,553 nodes &middot; 177,719 edges &middot; 13 types &middot; 20 relations</span></h2>
    <p class="subtitle">Heterogeneous schema with node features and temporal edges. Click nodes to explore. Gold = features/new edges.</p>
  </div>
  <div class="legend">
    <span class="legend-item"><span class="legend-dot" style="background:#4c72b0"></span> Bio</span>
    <span class="legend-item"><span class="legend-dot" style="background:#55a868"></span> Env</span>
    <span class="legend-item"><span class="legend-dot" style="background:#c44e52"></span> Bridge</span>
    <span class="legend-item"><span class="legend-dot" style="border:1.5px dashed #ffd700"></span> Features</span>
    <button class="btn" onclick="toggleTable()">Edges</button>
  </div>
</div>
<svg id="graph" viewBox="-20 10 620 710"></svg>
<div id="table-wrap"></div>
<div class="info-bar" id="info-bar"></div>

<script>
const nodes = {
  Gene:               { count: 10099, color: "#4c72b0", x: 140, y: 70,  feat: null },
  Pathway:            { count: 1492,  color: "#6a9dca", x: 40,  y: 190, feat: null },
  GeneProduct:        { count: 133,   color: "#8ca5c0", x: 40,  y: 300, feat: null },
  Variant:            { count: 709,   color: "#7a8fb5", x: 290, y: 150, feat: null },
  Biomarker:          { count: 24,    color: "#9db8cc", x: 290, y: 300, feat: null },
  ChromoRearr:        { count: 1993,  color: "#5a82a6", x: 500, y: 70,  feat: null },
  GeneFusion:         { count: 4266,  color: "#3a628a", x: 500, y: 190, feat: null },
  Disease:            { count: 43,    color: "#c44e52", x: 380, y: 370, feat: null },
  Chemical:           { count: 10,    color: "#55a868", x: 100, y: 500, feat: "3-dim" },
  GeoPoliticalRegion: { count: 3143,  color: "#2d8e4e", x: 40,  y: 630, feat: "12-dim" },
  GeographicRegion:   { count: 518,   color: "#3da85e", x: 300, y: 560, feat: "12-dim" },
  Country:            { count: 51,    color: "#1a7a3a", x: 500, y: 630, feat: null },
  CalendarYear:       { count: 72,    color: "#228B22", x: 500, y: 500, feat: "1-dim" },
};

const edges = [
  { src: "Gene", rel: "in_pathway", dst: "Pathway", count: 54005 },
  { src: "GeoPoliticalRegion", rel: "measured_in", dst: "CalendarYear", count: 31142, isNew: true },
  { src: "Disease", rel: "cancer_stats_in", dst: "GeographicRegion", count: 23076 },
  { src: "Gene", rel: "associated_with", dst: "Disease", count: 17701 },
  { src: "Chemical", rel: "exposure_in", dst: "GeoPoliticalRegion", count: 13988 },
  { src: "GeographicRegion", rel: "measured_in", dst: "CalendarYear", count: 11337, isNew: true },
  { src: "Disease", rel: "cancer_stats_in", dst: "Country", count: 10412 },
  { src: "Disease", rel: "has_fusion", dst: "GeneFusion", count: 4289 },
  { src: "GeoPoliticalRegion", rel: "part_of", dst: "Country", count: 3143 },
  { src: "Disease", rel: "has_rearrangement", dst: "ChromoRearr", count: 2309 },
  { src: "GeographicRegion", rel: "cancer_data_in", dst: "CalendarYear", count: 1923, isNew: true },
  { src: "Chemical", rel: "exposure_in", dst: "GeographicRegion", count: 1332 },
  { src: "Country", rel: "cancer_data_in", dst: "CalendarYear", count: 792, isNew: true },
  { src: "Variant", rel: "located_in_gene", dst: "Gene", count: 783 },
  { src: "Variant", rel: "variant_of", dst: "Disease", count: 733 },
  { src: "GeographicRegion", rel: "part_of", dst: "Country", count: 518 },
  { src: "GeneProduct", rel: "part_of_pathway", dst: "Pathway", count: 168 },
  { src: "Disease", rel: "subtype_of", dst: "Disease", count: 42, isNew: true },
  { src: "Biomarker", rel: "marker_for", dst: "Disease", count: 24 },
  { src: "Pathway", rel: "linked_to", dst: "Disease", count: 2 },
];

const ns = "http://www.w3.org/2000/svg";
const svg = document.getElementById("graph");
let selected = null;

function el(tag, attrs, parent) {
  const e = document.createElementNS(ns, tag);
  for (const [k, v] of Object.entries(attrs || {})) e.setAttribute(k, v);
  if (parent) parent.appendChild(e);
  return e;
}

el("line", { x1: 0, y1: 440, x2: 580, y2: 440, stroke: "rgba(255,255,255,0.08)", "stroke-dasharray": "6,4" }, svg);
let lbl;
lbl = el("text", { x: 560, y: 60, "text-anchor": "end", fill: "rgba(255,255,255,0.25)", "font-size": 11 }, svg);
lbl.textContent = "Biological Layer";
lbl = el("text", { x: 560, y: 475, "text-anchor": "end", fill: "rgba(255,255,255,0.25)", "font-size": 11 }, svg);
lbl.textContent = "Environmental Layer";
lbl = el("text", { x: 280, y: 455, "text-anchor": "middle", fill: "rgba(255,200,100,0.3)", "font-size": 9, "font-style": "italic" }, svg);
lbl.textContent = "Disease bridges both layers via subtype_of edges";

const edgeEls = edges.map((e) => {
  const s = nodes[e.src], d = nodes[e.dst];
  const isNew = e.isNew || false;
  const isSelf = e.src === e.dst;
  let path, label;

  if (isSelf) {
    const cx = s.x + 65, cy = s.y - 45;
    path = el("path", {
      d: "M"+(s.x+25)+","+(s.y-12)+" C"+cx+","+(cy-30)+" "+(cx+30)+","+cy+" "+(s.x+25)+","+(s.y+12),
      fill: "none", stroke: "rgba(255,200,100,0.25)", "stroke-width": 1, "stroke-dasharray": "6,3",
      "data-src": e.src, "data-dst": e.dst
    }, svg);
    label = el("text", { x: cx+20, y: cy-12, "text-anchor": "middle", class: "edge-label",
      fill: "rgba(255,200,100,0.9)", "data-src": e.src, "data-dst": e.dst }, svg);
    label.textContent = e.rel + " (" + e.count + ")";
  } else {
    const mx = (s.x+d.x)/2, my = (s.y+d.y)/2;
    const dx = d.x-s.x, dy = d.y-s.y;
    const len = Math.sqrt(dx*dx+dy*dy)||1;
    const cx = mx+(-dy/len)*20, cy = my+(dx/len)*20;
    const bc = isNew ? "rgba(255,200,100," : "rgba(255,255,255,";
    path = el("path", {
      d: "M"+s.x+","+s.y+" Q"+cx+","+cy+" "+d.x+","+d.y,
      fill: "none", stroke: bc+"0.12)", "stroke-width": 1,
      "stroke-dasharray": isNew ? "6,3" : "none",
      "data-src": e.src, "data-dst": e.dst, "data-new": isNew?"1":"0"
    }, svg);
    label = el("text", { x: cx, y: cy-6, "text-anchor": "middle", class: "edge-label",
      fill: isNew ? "rgba(255,200,100,0.9)" : "rgba(255,255,255,0.9)",
      "data-src": e.src, "data-dst": e.dst }, svg);
    label.textContent = e.rel + " (" + e.count.toLocaleString() + ")";
  }
  return { path, label, edge: e };
});

Object.entries(nodes).forEach(([name, n]) => {
  const sc = Math.max(20, Math.min(50, Math.log10(n.count+1)*18));
  const g = el("g", { transform: "translate("+n.x+","+n.y+")", class: "node-group" }, svg);
  const hf = !!n.feat;

  el("rect", {
    x: -sc*1.8, y: -sc*0.7, width: sc*3.6, height: sc*1.4, rx: 6,
    fill: n.color, opacity: 0.82,
    stroke: hf ? "#ffd700" : "transparent", "stroke-width": hf ? 1.5 : 0,
    "stroke-dasharray": hf ? "4,2" : "none", "data-name": name
  }, g);

  let t;
  t = el("text", { y: hf?-8:-3, "text-anchor": "middle", fill: "#fff",
    "font-size": Math.max(9, Math.min(12, sc*0.3)), "font-weight": "bold", "font-family": "system-ui" }, g);
  t.textContent = name;

  t = el("text", { y: hf?5:12, "text-anchor": "middle", fill: "rgba(255,255,255,0.8)",
    "font-size": Math.max(7, Math.min(9, sc*0.24)), "font-family": "system-ui" }, g);
  t.textContent = n.count.toLocaleString() + " nodes";

  if (hf) {
    t = el("text", { y: 18, "text-anchor": "middle", fill: "#ffd700",
      "font-size": 7, "font-family": "system-ui" }, g);
    t.textContent = n.feat;
  }

  g.addEventListener("click", () => { selected = selected===name ? null : name; update(); });
  g.addEventListener("mouseenter", () => { if (!selected) highlight(name); });
  g.addEventListener("mouseleave", () => { if (!selected) highlight(null); });
});

function highlight(name) {
  document.querySelectorAll("[data-name]").forEach(r => {
    const nm = r.dataset.name;
    r.setAttribute("opacity", name ? (nm===name?1:0.4) : 0.82);
    if (nm===name) { r.setAttribute("stroke","#fff"); r.setAttribute("stroke-width","2.5"); }
    else if (nodes[nm] && nodes[nm].feat) { r.setAttribute("stroke","#ffd700"); r.setAttribute("stroke-width","1.5"); }
    else { r.setAttribute("stroke","transparent"); r.setAttribute("stroke-width","0"); }
  });

  edgeEls.forEach(({ path, label, edge }) => {
    const active = !name || edge.src===name || edge.dst===name;
    const isNew = edge.isNew;
    const bc = isNew ? "rgba(255,200,100," : "rgba(255,255,255,";
    path.setAttribute("stroke", active&&name ? bc+"0.8)" : bc+"0.12)");
    path.setAttribute("stroke-width", active&&name ? 2 : 1);
    label.style.display = active&&name ? "block" : "none";
  });

  const bar = document.getElementById("info-bar");
  if (name) {
    const n = nodes[name];
    const conn = edges.filter(e => e.src===name || e.dst===name);
    const te = conn.reduce((s,e) => s+e.count, 0);
    const fs = n.feat ? '<span style="color:#ffd700">'+n.feat+' features</span>' : "learnable embedding";
    bar.innerHTML = '<span style="font-weight:600;color:'+n.color+'">'+name+'</span> <span>'+n.count.toLocaleString()+' nodes</span> <span>'+fs+'</span> <span>'+conn.length+' relations</span> <span>'+te.toLocaleString()+' edges</span>';
    bar.style.display = "flex";
  } else { bar.style.display = "none"; }
}

function update() { highlight(selected); }

function toggleTable() {
  const w = document.getElementById("table-wrap");
  if (w.style.display==="none" || !w.style.display) {
    const shown = selected ? edges.filter(e => e.src===selected||e.dst===selected) : edges;
    let h = '<table><thead><tr><th>Source</th><th>Relation</th><th>Target</th><th style="text-align:right">Edges</th><th style="text-align:center">New</th></tr></thead><tbody>';
    shown.forEach(e => {
      const isN = e.isNew||false;
      h += '<tr style="border-bottom:1px solid rgba(255,255,255,0.05);'+(isN?'background:rgba(255,200,100,0.05)':'')+'"><td><span class="legend-dot" style="background:'+nodes[e.src].color+';width:8px;height:8px;margin-right:6px;vertical-align:middle"></span>'+e.src+'</td><td style="color:'+(isN?'#ffd700':'#999')+'">'+e.rel+'</td><td><span class="legend-dot" style="background:'+nodes[e.dst].color+';width:8px;height:8px;margin-right:6px;vertical-align:middle"></span>'+e.dst+'</td><td class="td-right">'+e.count.toLocaleString()+'</td><td style="text-align:center">'+(isN?'&#10022;':'')+'</td></tr>';
    });
    h += '</tbody></table>';
    w.innerHTML = h;
    w.style.display = "block";
  } else { w.style.display = "none"; }
}
</script>
</body>
</html>
